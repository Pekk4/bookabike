services:
  frontend:
    build:
      context: frontend/
      dockerfile: Dockerfile
    volumes:
      - $PWD/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - staging
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}
      - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
      - VITE_KEYCLOAK_CLIENT=${VITE_KEYCLOAK_CLIENT}
      - VITE_BOOKABIKE_JWT_ROLES_CLAIM_NAME=${VITE_BOOKABIKE_JWT_ROLES_CLAIM_NAME}
      - VITE_BOOKABIKE_JWT_ADMIN_ROLE_NAME=${VITE_BOOKABIKE_JWT_ADMIN_ROLE_NAME}

  backend:
    build:
      context: backend/
      dockerfile: Dockerfile
    networks:
      - staging
      - data
    environment:
      - PORT=${PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SSLMODE=${DB_SSLMODE}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - KEYCLOAK_BASE_URL=${KEYCLOAK_BASE_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - BOOKABIKE_JWT_ROLES_CLAIM_NAME=${BOOKABIKE_JWT_ROLES_CLAIM_NAME}
      - BOOKABIKE_JWT_ADMIN_ROLE_NAME=${BOOKABIKE_JWT_ADMIN_ROLE_NAME}
      - BOOKABIKE_JWT_VENDOR_ROLE_NAME=${BOOKABIKE_JWT_VENDOR_ROLE_NAME}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_HEADERS=${CORS_ALLOWED_HEADERS}

networks:
  staging:
    name: staging
    external: true
  data:
    name: data
    external: true
